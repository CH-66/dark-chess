<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>随机暗棋 · 游戏原型</title>
  <link rel="stylesheet" href="src/style.css?v=20260919-identity-fix" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="eyebrow">RANDOM DARK CHINESE CHESS</div>
        <h1>随机暗棋</h1>
        <p>位置决定第一次行动，翻棋决定之后身份。</p>
      </div>
      <div class="seed-controls"><label for="seedInput">对局种子</label><input id="seedInput" placeholder="留空=随机"><span id="seedText">随机种子</span></div><button id="restartBtn" class="secondary" type="button" data-testid="restart">重新开局</button>
    </header>

    <section class="game-shell">
      <div class="game-card">
        <div class="statusbar">
          <div>
            <div id="turnText" class="turn">红方回合</div>
            <div id="hintText" class="hint">选择一枚己方棋子开始行动</div>
          </div>
          <div id="phaseText" class="phase">对局进行中</div>
        </div>

        <div class="board-wrap">
          <div id="board" class="board" aria-label="随机暗棋棋盘" data-testid="board"></div>
        </div>

        <div class="legend">
          <span><i class="dot red-dot"></i>红方</span>
          <span><i class="dot black-dot"></i>黑方</span>
          <span><i class="dot hidden-dot"></i>暗棋</span>
          <span><i class="dot move-dot"></i>可移动</span>
        </div>
      </div>

      <aside class="side-card">
        <section class="panel action-panel">
          <div class="panel-title">
            <h2>当前操作</h2>
            <span id="selectedBadge" class="badge">未选择</span>
          </div>
          <button id="revealBtn" class="primary" disabled type="button" data-testid="reveal">原地翻开</button>
          <div id="selectedInfo" class="selected-info">选择己方棋子后，这里会显示它的公开信息。</div>
        </section>

        <section class="panel">
          <h2>规则速览</h2>
          <ul class="rules">
            <li>暗棋首次行动按初始位置类型走，移动后必须翻开。</li>
            <li>也可以选择原地翻开，翻开后本回合结束。</li>
            <li>翻开后永久公开，并按真实棋子走法行动。</li>
            <li>吃暗棋不揭示其真实身份；吃到帅/将即胜。</li>
          </ul>
        </section>

        <section class="panel log-panel">
          <div class="panel-title">
            <h2>对局记录</h2>
            <span id="moveCount" class="muted">0 手</span>
          </div>
          <div id="log" class="log" aria-live="polite"></div>
        </section>
      </aside>
    </section>

    <footer class="footer">
      <span>V0.3 Prototype</span>
      <span>本地双人 · 零依赖</span>
    </footer>
  </main>

  <script type="module" src="src/app.js?v=20260919-identity-fix"></script>
</body>
</html>
