name: Deploy to CloudBase

concurrency:
  group: cloudbase-production-deploy
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
      TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
      TCB_IS_INTL: ${{ vars.TCB_IS_INTL || 'false' }}
      TCB_CLOUDRUN_SERVICE: dark-chess-online
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate CloudBase credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TCB_ENV_ID"
          test -n "$TCB_SECRET_ID"
          test -n "$TCB_SECRET_KEY"

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login to CloudBase
        run: tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"

      - name: Verify CloudBase environment
        run: tcb env detail -e "$TCB_ENV_ID"

      - name: Deploy CloudRun WebSocket service
        shell: bash
        run: |
          set -euo pipefail
          tcb cloudrun deploy             -e "$TCB_ENV_ID"             -s "$TCB_CLOUDRUN_SERVICE"             --source .             --port 8080             --force             --yes             --wait             --open-access-types PUBLIC             --min-num 1             --max-num 1

      - name: Resolve CloudRun public domain
        id: cloudrun
        shell: bash
        run: |
          set -euo pipefail
          tcb cloudrun detail             -e "$TCB_ENV_ID"             -s "$TCB_CLOUDRUN_SERVICE"             --json > cloudrun-detail.json
          DOMAIN="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = JSON.parse(fs.readFileSync('cloudrun-detail.json','utf8'));
          function find(v) {
            if (Array.isArray(v)) {
              for (const item of v) { const r = find(item); if (r) return r; }
            } else if (v && typeof v === 'object') {
              for (const [k, value] of Object.entries(v)) {
                if ((k === 'DefaultDomainName' || k === 'defaultDomainName') &&
                    typeof value === 'string' && value) return value.replace(/^https?:\\/\\//, '');
                const r = find(value); if (r) return r;
              }
            }
            return '';
          }
          process.stdout.write(find(raw));
          NODE
          )"
          test -n "$DOMAIN"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Check CloudRun health
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="${{ steps.cloudrun.outputs.domain }}"
          STATUS="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://$DOMAIN/healthz")"
          test "$STATUS" = "200"

      - name: Install runtime dependency
        run: npm install --no-audit --no-fund

      - name: Check CloudRun WebSocket
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="${{ steps.cloudrun.outputs.domain }}"
          DOMAIN="$DOMAIN" node --input-type=module <<'NODE'
          import WebSocket from 'ws';
          const url = 'wss://' + process.env.DOMAIN;
          const ws = new WebSocket(url);
          const timeout = setTimeout(() => { ws.terminate(); process.exit(1); }, 15000);
          ws.on('open', () => {
            ws.send(JSON.stringify({
              protocolVersion: 1,
              gameVersion: '0.4',
              roomId: null,
              commandId: 'ci-room-create',
              expectedRevision: 0,
              command: { type: 'room.create' }
            }));
          });
          ws.on('message', raw => {
            const message = JSON.parse(String(raw));
            if (message.type !== 'room.created' ||
                !message.roomId || !message.sessionToken || !message.side) {
              ws.terminate();
              clearTimeout(timeout);
              process.exit(1);
            }
            clearTimeout(timeout);
            ws.close();
          });
          ws.on('close', () => process.exit(0));
          ws.on('error', () => { clearTimeout(timeout); process.exit(1); });
          NODE

      - name: Prepare static artifact
        shell: bash
        env:
          CLOUDRUN_DOMAIN: ${{ steps.cloudrun.outputs.domain }}
        run: |
          set -euo pipefail
          rm -rf .cloudbase-dist
          mkdir -p .cloudbase-dist/src
          cp index.html .cloudbase-dist/index.html
          cp -R src .cloudbase-dist/src
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const domain = process.env.CLOUDRUN_DOMAIN;
          const runtime = '// Generated by GitHub Actions; no secrets are stored here.\n' +
            'window.__DARK_CHESS_CONFIG__ = ' +
            JSON.stringify({ wsEndpoint: 'wss://' + domain }) +
            ';\n';
          fs.writeFileSync('.cloudbase-dist/src/runtime-config.js', runtime);
          NODE
          grep -n "wsEndpoint" .cloudbase-dist/src/runtime-config.js

      - name: Deploy static hosting
        run: tcb hosting deploy .cloudbase-dist -e "$TCB_ENV_ID" --safe --verify --yes

      - name: Configure static website documents
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @cloudbase/manager-node
          node --input-type=module <<'NODE'
          import CloudBase from '@cloudbase/manager-node';
          const cloudbase = new CloudBase({
            secretId: process.env.TCB_SECRET_ID,
            secretKey: process.env.TCB_SECRET_KEY,
            envId: process.env.TCB_ENV_ID,
          });
          const res = await cloudbase.hosting.setWebsiteDocument({
            indexDocument: 'index.html',
            errorDocument: 'index.html',
            routingRules: [
              { httpErrorCodeReturnedEquals: '404', replaceKeyWith: 'index.html' }
            ],
          });
          if (res?.statusCode !== 200) throw new Error(JSON.stringify(res));
          NODE

      - name: Resolve static hosting domain
        id: hosting
        shell: bash
        run: |
          set -euo pipefail
          tcb hosting detail -e "$TCB_ENV_ID" --json > hosting-detail.json
          DOMAIN="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = JSON.parse(fs.readFileSync('hosting-detail.json','utf8'));
          function find(v) {
            if (Array.isArray(v)) {
              for (const item of v) { const r=find(item); if(r)return r; }
            } else if (v && typeof v === 'object') {
              for (const [k,value] of Object.entries(v)) {
                if (typeof value === 'string' &&
                    (k === 'Domain' || k === 'domain' || k === 'PublicDomain' || k === 'publicDomain') &&
                    value.includes('.tcloudbaseapp.com')) return value.replace(/^https?:\\/\\//,'');
                const r=find(value); if(r)return r;
              }
            }
            return '';
          }
          process.stdout.write(find(raw));
          NODE
          )"
          if [ -z "$DOMAIN" ]; then DOMAIN="gamehub-d1g71qsoadd40adba-1300630036.tcloudbaseapp.com"; fi
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Verify static resources
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="${{ steps.hosting.outputs.domain }}"
          test "$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://$DOMAIN/")" = "200"
          test "$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://$DOMAIN/src/app.js")" = "200"
          test "$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://$DOMAIN/src/runtime-config.js")" = "200"

      - name: Public dual-browser acceptance
        shell: bash
        env:
          PUBLIC_DOMAIN: ${{ steps.hosting.outputs.domain }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install chromium --with-deps
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const base = 'https://' + process.env.PUBLIC_DOMAIN;
          const browser = await chromium.launch({ headless: true });

          async function openGame(context) {
            const page = await context.newPage();
            await page.goto(base + '/?publicOnlineAcceptance=1', { waitUntil: 'domcontentloaded' });
            let body = await page.locator('body').innerText().catch(() => '');
            let title = await page.title().catch(() => '');
            if (title.includes('风险提醒') || body.includes('确定访问')) {
              const enter = page.getByText('确定访问', { exact: true }).first();
              await enter.waitFor({ state: 'visible', timeout: 5000 });
              await enter.click();
              await page.waitForLoadState('domcontentloaded').catch(() => {});
              await page.waitForTimeout(300);
            }
            await page.locator('[data-testid="board"]').waitFor({ state: 'visible', timeout: 15000 });
            return page;
          }

          const redContext = await browser.newContext();
          const blackContext = await browser.newContext();
          const red = await openGame(redContext);
          const black = await openGame(blackContext);

          await red.getByTestId('mode-online').click();
          await red.getByTestId('create-room').click();
          await red.waitForFunction(() =>
            document.querySelector('[data-testid="network-status"]')?.textContent.includes('已连接'),
            null,
            { timeout: 20000 },
          );

          const roomId = (await red.getByTestId('room-code').textContent()).trim();
          if (!/^[A-Z0-9]{8}$/.test(roomId)) throw new Error('Invalid room code: ' + roomId);

          await black.getByTestId('mode-online').click();
          await black.getByTestId('room-input').fill(roomId);
          await black.getByTestId('join-room').click();

          await black.waitForFunction(() =>
            document.querySelector('[data-testid="network-status"]')?.textContent.includes('已连接 · 对局中'),
            null,
            { timeout: 20000 },
          );
          await red.waitForFunction(() =>
            document.querySelector('[data-testid="network-status"]')?.textContent.includes('已连接 · 对局中'),
            null,
            { timeout: 20000 },
          );

          const redSide = (await red.getByTestId('player-side').textContent()).trim();
          const blackSide = (await black.getByTestId('player-side').textContent()).trim();
          if (redSide !== '红方' || blackSide !== '黑方') {
            throw new Error('Unexpected sides: ' + redSide + ' / ' + blackSide);
          }

          if (await red.locator('[data-testid="board"] .piece').count() !== 32) {
            throw new Error('Red board does not contain 32 pieces');
          }
          if (await black.locator('[data-testid="board"] .piece').count() !== 32) {
            throw new Error('Black board does not contain 32 pieces');
          }

          await red.locator('[data-testid="board"] .piece.red.hidden').first().click();
          await red.getByTestId('reveal').click();
          await red.waitForFunction(() =>
            document.querySelector('[data-testid="moveCount"]')?.textContent === '1 手',
            null,
            { timeout: 10000 },
          );
          await black.waitForFunction(() =>
            document.querySelector('[data-testid="moveCount"]')?.textContent === '1 手',
            null,
            { timeout: 10000 },
          );

          await redContext.close();
          await blackContext.close();
          await browser.close();
          NODE

      - name: Deployment summary
        if: always()
        env:
          CLOUDRUN_DOMAIN: ${{ steps.cloudrun.outputs.domain }}
          HOSTING_DOMAIN: ${{ steps.hosting.outputs.domain }}
        run: |
          {
            echo "## CloudBase V0.4 部署验收"
            echo "- CloudRun service: $TCB_CLOUDRUN_SERVICE"
            echo "- CloudRun domain: $CLOUDRUN_DOMAIN"
            echo "- Static Hosting domain: $HOSTING_DOMAIN"
            echo "- WSS: wss://$CLOUDRUN_DOMAIN"
          } >> "$GITHUB_STEP_SUMMARY"
