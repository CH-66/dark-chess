name: Deploy to CloudBase

concurrency:
  group: cloudbase-production-deploy
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
      TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
      TCB_IS_INTL: ${{ vars.TCB_IS_INTL || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: CloudBase end-to-end deployment and acceptance
        id: deploy
        shell: bash
        run: |
          set +e

          WORKDIR="$(mktemp -d)"
          STATUS_FILE="docs/CLOUDBASE_DEPLOY_STATUS.md"
          PUBLIC_URL=""

          mkdir -p "$(dirname "$STATUS_FILE")"

          run_stage() {
            local name="$1"
            shift
            echo ""
            echo "===== $name ====="
            "$@"
            local code=$?
            if [ "$code" -ne 0 ]; then
              FAILED_STAGE="$name"
              FAILED_CODE="$code"
              FAILED_OUTPUT="$(cat "$WORKDIR/current.log" 2>/dev/null | tail -n 20)"
              return "$code"
            fi
            return 0
          }

          overall=0
          FAILED_STAGE=""
          FAILED_CODE=0
          FAILED_OUTPUT=""

          echo "repo=$GITHUB_REPOSITORY" > "$WORKDIR/meta"
          echo "sha=$GITHUB_SHA" >> "$WORKDIR/meta"

          if [ -z "$TCB_ENV_ID" ]; then
            FAILED_STAGE="Validate credentials"
            FAILED_CODE=1
            FAILED_OUTPUT="Missing TCB_ENV_ID"
            overall=1
          elif [ -z "$TCB_SECRET_ID" ]; then
            FAILED_STAGE="Validate credentials"
            FAILED_CODE=1
            FAILED_OUTPUT="Missing TCB_SECRET_ID"
            overall=1
          elif [ -z "$TCB_SECRET_KEY" ]; then
            FAILED_STAGE="Validate credentials"
            FAILED_CODE=1
            FAILED_OUTPUT="Missing TCB_SECRET_KEY"
            overall=1
          fi

          if [ "$overall" -eq 0 ]; then
            npm install -g @cloudbase/cli >"$WORKDIR/current.log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              FAILED_STAGE="Install CloudBase CLI"
              FAILED_CODE=$code
              FAILED_OUTPUT="$(tail -n 20 "$WORKDIR/current.log")"
              overall=1
            fi
          fi

          if [ "$overall" -eq 0 ]; then
            tcb --version | tee "$WORKDIR/cli-version.log"
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              FAILED_STAGE="Check CloudBase CLI"
              FAILED_CODE=$code
              FAILED_OUTPUT="$(tail -n 20 "$WORKDIR/cli-version.log")"
              overall=1
            fi
          fi

          if [ "$overall" -eq 0 ] && [ "$TCB_IS_INTL" = "true" ]; then
            tcb config set isIntl true >"$WORKDIR/current.log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              FAILED_STAGE="Configure CloudBase site"
              FAILED_CODE=$code
              FAILED_OUTPUT="$(tail -n 20 "$WORKDIR/current.log")"
              overall=1
            fi
          fi

          if [ "$overall" -eq 0 ]; then
            tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY" >"$WORKDIR/current.log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              FAILED_STAGE="Login to CloudBase"
              FAILED_CODE=$code
              FAILED_OUTPUT="$(tail -n 20 "$WORKDIR/current.log")"
              overall=1
            fi
          fi

          if [ "$overall" -eq 0 ]; then
            tcb env detail -e "$TCB_ENV_ID" >"$WORKDIR/current.log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              FAILED_STAGE="Verify CloudBase environment"
              FAILED_CODE=$code
              FAILED_OUTPUT="$(tail -n 20 "$WORKDIR/current.log")"
              overall=1
            fi
          fi

          if [ "$overall" -eq 0 ]; then
            rm -rf .cloudbase-dist
            mkdir -p .cloudbase-dist
            cp index.html .cloudbase-dist/index.html
            cp -R src .cloudbase-dist/src
            echo "Prepared static artifact:"
            find .cloudbase-dist -type f -print | sort
          fi

          if [ "$overall" -eq 0 ]; then
            tcb hosting deploy .cloudbase-dist -e "$TCB_ENV_ID"               --safe --verify --yes               >"$WORKDIR/current.log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              FAILED_STAGE="Deploy static hosting"
              FAILED_CODE=$code
              FAILED_OUTPUT="$(tail -n 40 "$WORKDIR/current.log")"
              overall=1
            fi
          fi

          if [ "$overall" -eq 0 ]; then
            npm install --no-save --no-package-lock @cloudbase/manager-node >"$WORKDIR/current.log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              FAILED_STAGE="Install CloudBase Manager SDK"
              FAILED_CODE=$code
              FAILED_OUTPUT="$(tail -n 20 "$WORKDIR/current.log")"
              overall=1
            fi
          fi

          if [ "$overall" -eq 0 ]; then
            node <<'NODE' >"$WORKDIR/current.log" 2>&1
          import CloudBase from '@cloudbase/manager-node';
          const cloudbase = new CloudBase({
            secretId: process.env.TCB_SECRET_ID,
            secretKey: process.env.TCB_SECRET_KEY,
            envId: process.env.TCB_ENV_ID,
          });
          const res = await cloudbase.hosting.setWebsiteDocument({
            indexDocument: 'index.html',
            errorDocument: 'index.html',
            routingRules: [
              {
                httpErrorCodeReturnedEquals: '404',
                replaceKeyWith: 'index.html',
              },
            ],
          });
          if (res?.statusCode !== 200) {
            throw new Error(JSON.stringify(res));
          }
          console.log('website documents configured');
          NODE
            code=$?
            if [ "$code" -ne 0 ]; then
              FAILED_STAGE="Configure index/error document"
              FAILED_CODE=$code
              FAILED_OUTPUT="$(tail -n 20 "$WORKDIR/current.log")"
              overall=1
            fi
          fi

          if [ "$overall" -eq 0 ]; then
            tcb hosting detail -e "$TCB_ENV_ID" >"$WORKDIR/hosting.log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              FAILED_STAGE="Verify hosting"
              FAILED_CODE=$code
              FAILED_OUTPUT="$(tail -n 20 "$WORKDIR/hosting.log")"
              overall=1
            else
              PUBLIC_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.tcloudbaseapp\.com' "$WORKDIR/hosting.log" | head -n 1)"
            fi
          fi

          HTTP_HOME=""
          HTTP_JS=""
          HTTP_CSS=""
          HTTP_REFRESH=""
          BODY_REFRESH="no"

          if [ "$overall" -eq 0 ]; then
            PUBLIC_URL="${PUBLIC_URL:-gamehub-d1g71qsoadd40adba-1300630036.tcloudbaseapp.com}"
            if [[ "$PUBLIC_URL" != https://* ]]; then PUBLIC_URL="https://$PUBLIC_URL"; fi
          fi

          if [ "$overall" -eq 0 ] && [ -n "$PUBLIC_URL" ]; then
            HTTP_HOME="$(curl -L -sS -o "$WORKDIR/home.html" -w '%{http_code}' --max-time 20 "$PUBLIC_URL/")"
            HTTP_JS="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$PUBLIC_URL/src/app.js")"
            HTTP_CSS="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$PUBLIC_URL/src/style.css")"
            HTTP_REFRESH="$(curl -L -sS -o "$WORKDIR/refresh.html" -w '%{http_code}' --max-time 20 "$PUBLIC_URL/acceptance-refresh-check")"
            if grep -q '随机暗棋' "$WORKDIR/refresh.html" 2>/dev/null; then
              BODY_REFRESH="yes"
            fi
            if [ "$HTTP_HOME" != "200" ] || [ "$HTTP_JS" != "200" ] || [ "$HTTP_CSS" != "200" ] || [ "$HTTP_REFRESH" != "200" ]; then
              overall=1
              FAILED_STAGE="Public HTTP acceptance"
              FAILED_CODE=1
              FAILED_OUTPUT="home=$HTTP_HOME js=$HTTP_JS css=$HTTP_CSS"
            fi
          fi


          if [ "$overall" -eq 0 ] && [ -n "$PUBLIC_URL" ]; then
            npm install --no-save --no-package-lock @playwright/test >"$WORKDIR/playwright-install.log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              FAILED_STAGE="Install Playwright"
              FAILED_CODE=$code
              FAILED_OUTPUT="$(tail -n 40 "$WORKDIR/playwright-install.log")"
              overall=1
            fi
          fi

          if [ "$overall" -eq 0 ] && [ -n "$PUBLIC_URL" ]; then
            npx playwright install chromium --with-deps >"$WORKDIR/playwright-browser.log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              FAILED_STAGE="Install Chromium"
              FAILED_CODE=$code
              FAILED_OUTPUT="$(tail -n 40 "$WORKDIR/playwright-browser.log")"
              overall=1
            fi
          fi

          if [ "$overall" -eq 0 ] && [ -n "$PUBLIC_URL" ]; then
            echo "===== Browser-like curl diagnostics ====="
            curl -L -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/144.0.0.0 Safari/537.36"               -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"               -D "$WORKDIR/browser-like-headers.txt"               -o "$WORKDIR/browser-like.html"               --max-time 20 "$PUBLIC_URL/"
            echo "browser_like_http=$?"
            head -n 20 "$WORKDIR/browser-like-headers.txt" || true
            echo "browser_like_body_marker=$(grep -c '随机暗棋' "$WORKDIR/browser-like.html" 2>/dev/null || true)"
          fi

          if [ "$overall" -eq 0 ] && [ -n "$PUBLIC_URL" ]; then
            PUBLIC_URL="$PUBLIC_URL" node --input-type=module <<'NODE' >"$WORKDIR/browser-acceptance.log" 2>&1
          import { chromium } from '@playwright/test';

          const url = process.env.PUBLIC_URL.replace(/\/$/, '');
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/144.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();
          const consoleErrors = [];
          const pageErrors = [];

          page.on('console', msg => {
            if (msg.type() === 'error') consoleErrors.push(msg.text());
          });
          page.on('pageerror', err => pageErrors.push(err.message));

          async function inspect() {
            return {
              url: page.url(),
              title: await page.title().catch(() => ''),
              body: await page.locator('body').innerText().catch(() => ''),
              boardCount: await page.locator('[data-testid="board"]').count().catch(() => 0),
              pieceCount: await page.locator('[data-piece-id]').count().catch(() => 0),
            };
          }

          const first = await page.goto(url + '/?browserAcceptance=1', {
            waitUntil: 'domcontentloaded',
          });

          let currentStatus = first?.status() ?? null;
          let info = await inspect();

          if (info.title.includes('风险提醒') || info.body.includes('确定访问')) {
            const enter = page.getByText('确定访问', { exact: true }).first();
            await enter.waitFor({ state: 'visible', timeout: 5_000 });
            await enter.click();
            await page.waitForLoadState('domcontentloaded').catch(() => {});
            await page.waitForTimeout(500);
            info = await inspect();
            currentStatus = 200;
          }

          console.log(JSON.stringify({
            firstStatus: first?.status() ?? null,
            finalStatus: currentStatus,
            finalUrl: info.url,
            title: info.title,
            hasGameText: info.body.includes('随机暗棋'),
            boardCount: info.boardCount,
            pieceCount: info.pieceCount,
            consoleErrors,
            pageErrors,
          }, null, 2));

          if (info.title.includes('风险提醒') || info.body.includes('确定访问')) {
            throw new Error('CloudBase access reminder was not cleared');
          }
          if (currentStatus !== 200) {
            throw new Error('Final home status: ' + currentStatus);
          }
          if (!info.body.includes('随机暗棋')) {
            throw new Error('Game page content not loaded');
          }
          if (info.boardCount !== 1) {
            throw new Error('Game board not found');
          }
          if (info.pieceCount < 32) {
            throw new Error('Expected at least 32 pieces, got ' + info.pieceCount);
          }
          if (consoleErrors.length || pageErrors.length) {
            throw new Error('Browser errors: ' + JSON.stringify({ consoleErrors, pageErrors }));
          }

          const refresh = await page.reload({ waitUntil: 'domcontentloaded' });
          const refreshInfo = await inspect();

          console.log(JSON.stringify({
            refreshStatus: refresh?.status() ?? null,
            refreshUrl: refreshInfo.url,
            refreshTitle: refreshInfo.title,
            refreshBoardCount: refreshInfo.boardCount,
            refreshPieceCount: refreshInfo.pieceCount,
          }, null, 2));

          if (!refresh || refresh.status() !== 200) {
            throw new Error('Refresh navigation status: ' + (refresh?.status() ?? 'no response'));
          }
          if (refreshInfo.title.includes('风险提醒') || refreshInfo.body.includes('确定访问')) {
            throw new Error('Refresh returned the CloudBase access reminder instead of the game');
          }
          if (refreshInfo.boardCount !== 1 || refreshInfo.pieceCount < 32) {
            throw new Error('Game board not restored after refresh');
          }

          await browser.close();
          NODE
            code=$?
            if [ "$code" -ne 0 ]; then
              FAILED_STAGE="Public browser acceptance"
              FAILED_CODE=$code
              FAILED_OUTPUT="$(tail -n 80 "$WORKDIR/browser-acceptance.log")"
              overall=1
            fi
          fi


          cat > "$STATUS_FILE" <<EOF
          # CloudBase 部署回执

          - 时间（UTC）：$(date -u '+%Y-%m-%d %H:%M:%S')
          - Commit：$GITHUB_SHA
          - CloudBase Environment：$TCB_ENV_ID
          - CLI：$(cat "$WORKDIR/cli-version.log" 2>/dev/null | tail -n 1)
          - 公网域名：${PUBLIC_URL:-未获取}
          - 首页 HTTP：${HTTP_HOME:-未执行}
          - app.js HTTP：${HTTP_JS:-未执行}
          - style.css HTTP：${HTTP_CSS:-未执行}
          - 刷新路径 HTTP：${HTTP_REFRESH:-未执行}
          - 刷新路径内容包含“随机暗棋”：$BODY_REFRESH
          - 总体结果：$([ "$overall" -eq 0 ] && echo PASS || echo FAIL)
          - 失败阶段：${FAILED_STAGE:-无}
          - 失败退出码：$FAILED_CODE

          ## 失败输出（已限制最后 20 行）

          ${FAILED_OUTPUT:-无}
          EOF

          echo "===== CloudBase acceptance receipt ====="
          cat "$STATUS_FILE"

          if [ "$overall" -ne 0 ]; then
            exit "$overall"
          fi

      - name: Publish deployment receipt
        if: always()
        shell: bash
        run: |
          if [ -f docs/CLOUDBASE_DEPLOY_STATUS.md ]; then
            cat docs/CLOUDBASE_DEPLOY_STATUS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# CloudBase 部署回执" >> "$GITHUB_STEP_SUMMARY"
            echo "- Overall: workflow did not reach receipt generation" >> "$GITHUB_STEP_SUMMARY"
          fi

          mkdir -p artifacts
          cp docs/CLOUDBASE_DEPLOY_STATUS.md artifacts/cloudbase-deploy-status.md 2>/dev/null || true

      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudbase-deployment-receipt
          path: artifacts/cloudbase-deploy-status.md
          if-no-files-found: warn
