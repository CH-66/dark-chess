name: Deploy to CloudBase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
      TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
      # Domestic is the default. For an international-site environment,
      # create repository variable TCB_IS_INTL=true.
      TCB_IS_INTL: ${{ vars.TCB_IS_INTL || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate CloudBase credentials
        run: |
          test -n "$TCB_ENV_ID" || { echo "::error::Missing GitHub Secret TCB_ENV_ID"; exit 1; }
          test -n "$TCB_SECRET_ID" || { echo "::error::Missing GitHub Secret TCB_SECRET_ID"; exit 1; }
          test -n "$TCB_SECRET_KEY" || { echo "::error::Missing GitHub Secret TCB_SECRET_KEY"; exit 1; }

      - name: Install CloudBase CLI
        run: |
          npm install -g @cloudbase/cli
          tcb --version

      - name: Configure CloudBase site
        run: |
          if [ "$TCB_IS_INTL" = "true" ]; then
            tcb config set isIntl true
          fi

      - name: Login to CloudBase
        run: |
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"

      - name: Verify CloudBase environment
        run: |
          tcb env detail -e "$TCB_ENV_ID"

      - name: Deploy static site
        run: |
          tcb hosting deploy . / -e "$TCB_ENV_ID" \
            --ignore ".git,node_modules,.github,tests,docs,config,*.log" \
            --verify

      - name: Configure SPA entry and error page
        run: |
          npm install --no-save --no-package-lock @cloudbase/manager-node
          node .github/scripts/configure-cloudbase-hosting.mjs

      - name: Verify hosting
        run: |
          tcb hosting detail -e "$TCB_ENV_ID"
